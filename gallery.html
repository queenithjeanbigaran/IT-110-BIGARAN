<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bigaran | Photo &amp; Media Gallery</title>
  </head>

  <body>
    <header>
      <a class="back" href="activity.html">&larr; Back to main activity page</a>
      <h1>Photo &amp; Media Gallery</h1>
      <p>Extra images and media that didn't fit on the main activity page.</p>
    </header>

    <main>
      <section id="extra-photos">
        <h2>More Photos</h2>
        <div class="gallery">
          <figure>
            <img
              src="images/bunny-enclosure.png"
              alt="Enclosure for our bunny pets"
              width="600px"
            />
            <figcaption>Enclosure for our bunny pets</figcaption>
          </figure>
          <figure>
            <img
              src="images/barn.png"
              alt="A barn for our passive minecraft mobs"
              width="600px"
            />
            <figcaption>A barn for our passive minecraft mobs</figcaption>
          </figure>
          <figure>
            <img
              src="images/moss-cave-entrance.png"
              alt="A mossy cave entrance"
              width="600px"
            />
            <figcaption>A mossy cave entrance</figcaption>
          </figure>
        </div>
      </section>

      <section id="extra-media">
        <h2>Bonus Media</h2>
        <video controls width="400">
          <source src="media/cemetery-and-economy.mp4" type="video/mp4" />
          Your browser does not support the video element. You can
          <a href="media/cemetery-and-economy.mp4">download the video file</a>
          instead.
        </video>
      </section>
    </main>
  </body>
</html>
